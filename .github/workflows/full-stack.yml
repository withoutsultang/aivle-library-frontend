name: Full-stack E2E
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-api-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: withoutsultang/aivle-library-backend
          ref: dev
          path: backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Record tested backend revision
        run: git -C backend rev-parse HEAD
      - run: chmod +x backend/gradlew
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-stack-test-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-results.json
            frontend/docs/evidence/e2e-summary.json
          retention-days: 7
